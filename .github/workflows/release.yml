name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: pullweights-linux-amd64
            musl: true
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: pullweights-linux-arm64
            cross: true
          - name: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: pullweights-darwin-amd64
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: pullweights-darwin-arm64
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pullweights-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain (Linux amd64)
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          curl -sSL https://github.com/pullweights/cli/releases/download/toolchain/aarch64-linux-musl-cross.tgz | sudo tar xz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/pullweights ${{ matrix.binary }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/pullweights.exe ${{ matrix.binary }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            musl: true
          - arch: arm64
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install musl toolchain (amd64)
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation deps (ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          curl -sSL https://github.com/pullweights/cli/releases/download/toolchain/aarch64-linux-musl-cross.tgz | sudo tar xz -C /opt
          echo "/opt/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV

      - name: Build .deb
        run: cargo deb --target=${{ matrix.target }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/${{ matrix.target }}/debian/*.deb

  apt-repo:
    name: Publish APT Repository
    needs: deb
    runs-on: ubuntu-latest
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import GPG key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Export public key
        run: |
          mkdir -p repo
          gpg --armor --export "${{ vars.APT_GPG_KEY_ID }}" > repo/gpg

      - name: Create CNAME
        run: echo "apt.pullweights.com" > repo/CNAME

      - name: Configure reprepro
        run: |
          mkdir -p repo/conf
          cat > repo/conf/distributions << 'CONF'
          Origin: PullWeights
          Label: PullWeights
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: PullWeights CLI packages
          SignWith: ${{ vars.APT_GPG_KEY_ID }}
          CONF

      - name: Add .deb packages
        run: |
          for deb in debs/*.deb; do
            reprepro -b repo includedeb stable "$deb"
          done

      - name: Create landing page
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > repo/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PullWeights APT Repository</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #c8c8d0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .container { max-width: 640px; padding: 2rem; }
              h1 { color: #fff; font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
              .subtitle { color: #6b6b80; font-size: 0.9rem; margin-bottom: 2rem; }
              .section { margin-bottom: 1.5rem; }
              .label { color: #6b6b80; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
              pre { background: #12121a; border: 1px solid #1e1e2e; border-radius: 8px; padding: 1rem; overflow-x: auto; font-size: 0.82rem; line-height: 1.6; color: #a5a5b8; }
              a { color: #818cf8; text-decoration: none; }
              a:hover { color: #a5b4fc; }
              .links { display: flex; gap: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>PullWeights APT Repository</h1>
              <p class="subtitle">Debian/Ubuntu packages for the PullWeights CLI. amd64 + arm64.</p>
              <div class="section">
                <p class="label">Install</p>
                <pre>curl -fsSL https://apt.pullweights.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/pullweights.gpg
          echo "deb [signed-by=/usr/share/keyrings/pullweights.gpg] https://apt.pullweights.com stable main" \
            | sudo tee /etc/apt/sources.list.d/pullweights.list
          sudo apt update &amp;&amp; sudo apt install pullweights</pre>
              </div>
              <div class="section">
                <p class="label">Update</p>
                <pre>sudo apt update &amp;&amp; sudo apt upgrade pullweights</pre>
              </div>
              <div class="links">
                <a href="https://pullweights.com/docs/cli">Docs</a>
                <a href="https://github.com/pullweights/cli">CLI Source</a>
                <a href="https://github.com/pullweights/cli/releases">Releases</a>
                <a href="/gpg">GPG Key</a>
              </div>
            </div>
          </body>
          </html>
          HTML
          sed -i 's/^          //' repo/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.APT_DEPLOY_KEY }}
          external_repository: pullweights/apt
          publish_branch: gh-pages
          publish_dir: repo

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: pullweights/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update formula
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          sha_darwin_arm64=$(shasum -a 256 artifacts/pullweights-darwin-arm64/pullweights-darwin-arm64 | awk '{print $1}')
          sha_darwin_amd64=$(shasum -a 256 artifacts/pullweights-darwin-amd64/pullweights-darwin-amd64 | awk '{print $1}')
          sha_linux_arm64=$(shasum -a 256 artifacts/pullweights-linux-arm64/pullweights-linux-arm64 | awk '{print $1}')
          sha_linux_amd64=$(shasum -a 256 artifacts/pullweights-linux-amd64/pullweights-linux-amd64 | awk '{print $1}')

          cat > Formula/pullweights.rb << FORMULA
          class Pullweights < Formula
            desc "CLI for PullWeights — the decentralized AI model registry"
            homepage "https://github.com/pullweights/cli"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/pullweights/cli/releases/download/v#{version}/pullweights-darwin-arm64"
                sha256 "${sha_darwin_arm64}"
              else
                url "https://github.com/pullweights/cli/releases/download/v#{version}/pullweights-darwin-amd64"
                sha256 "${sha_darwin_amd64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/pullweights/cli/releases/download/v#{version}/pullweights-linux-arm64"
                sha256 "${sha_linux_arm64}"
              else
                url "https://github.com/pullweights/cli/releases/download/v#{version}/pullweights-linux-amd64"
                sha256 "${sha_linux_amd64}"
              end
            end

            def install
              binary = Dir.glob("pullweights-*").first
              mv binary, "pullweights"
              bin.install "pullweights"
            end

            test do
              assert_match "pullweights", shell_output("#{bin}/pullweights --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/pullweights.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pullweights.rb
          git commit -m "Update pullweights to ${GITHUB_REF_NAME}"
          git push
