[package]
name = "pullweights-cli"
version = "0.7.6"
edition = "2021"
description = "The CLI for PullWeights — the decentralized AI model registry"
license = "MIT"
repository = "https://github.com/pullweights/cli"

[[bin]]
name = "pullweights"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
rpassword = "7"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
fastcdc = { version = "3", features = ["tokio"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[package.metadata.deb]
name = "pullweights"
maintainer = "PullWeights <support@pullweights.com>"
copyright = "2024-2026, PullWeights Inc."
license-file = ["LICENSE", "0"]
extended-description = "Push, pull, tag, and version AI models from the command line."
depends = ""
section = "utils"
priority = "optional"
assets = [
    ["target/release/pullweights", "usr/bin/pullweights", "755"],
]

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
